# 示例：完整的 CI/CD 流程
# 放置在你的仓库中：.github/workflows/main.yml

name: Full CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 第一阶段：安全扫描和代码检查（并行执行）
  security:
    uses: geminiyellow/hello-dependabot-actions/.github/workflows/reusable-security-scan.yml@main
    with:
      severity-threshold: 'moderate'
      fail-on-severity: 'high'

  lint:
    uses: geminiyellow/hello-dependabot-actions/.github/workflows/reusable-lint.yml@main
    with:
      node-version: '18.x'

  # 第二阶段：CI 测试和构建
  ci:
    needs: [security, lint]
    uses: geminiyellow/hello-dependabot-actions/.github/workflows/reusable-node-ci.yml@main
    with:
      node-version: '18.x'
      run-tests: true
      run-build: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 第三阶段：部署到 staging（仅在 push 到 main 时）
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    uses: geminiyellow/hello-dependabot-actions/.github/workflows/reusable-deploy.yml@main
    with:
      environment: 'staging'
      node-version: '18.x'
      build-command: 'npm run build:staging'
    secrets:
      DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}

  # 第四阶段：部署到 production（需要手动审批）
  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy-staging
    uses: geminiyellow/hello-dependabot-actions/.github/workflows/reusable-deploy.yml@main
    with:
      environment: 'production'
      node-version: '18.x'
      build-command: 'npm run build'
    secrets:
      DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
