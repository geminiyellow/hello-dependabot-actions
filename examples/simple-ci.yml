# 示例：简单的 CI 流程
# 放置在你的仓库中：.github/workflows/ci.yml

name: Simple CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    uses: geminiyellow/hello-dependabot-actions/.github/workflows/reusable-node-ci.yml@main
    with:
      node-version: '18.x'
      run-tests: true
      run-build: true
