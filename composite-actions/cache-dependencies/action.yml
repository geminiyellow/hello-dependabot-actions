name: 'Cache Dependencies'
description: 'Cache project dependencies for faster builds'
author: 'geminiyellow'

inputs:
  package-manager:
    description: 'Package manager to use (npm, yarn, pnpm)'
    required: false
    default: 'npm'
  working-directory:
    description: 'Working directory for the project'
    required: false
    default: '.'
  cache-key-prefix:
    description: 'Prefix for cache key'
    required: false
    default: 'deps'

outputs:
  cache-hit:
    description: 'Whether cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: 'The cache key that was used'
    value: ${{ steps.prepare.outputs.cache-key }}

runs:
  using: 'composite'
  steps:
    - name: Prepare cache configuration
      id: prepare
      shell: bash
      run: |
        PKG_MANAGER="${{ inputs.package-manager }}"
        WORK_DIR="${{ inputs.working-directory }}"
        PREFIX="${{ inputs.cache-key-prefix }}"

        # Determine lock file based on package manager
        case "$PKG_MANAGER" in
          npm)
            LOCK_FILE="${WORK_DIR}/package-lock.json"
            CACHE_PATH="${WORK_DIR}/node_modules"
            ;;
          yarn)
            LOCK_FILE="${WORK_DIR}/yarn.lock"
            CACHE_PATH="${WORK_DIR}/node_modules"
            ;;
          pnpm)
            LOCK_FILE="${WORK_DIR}/pnpm-lock.yaml"
            CACHE_PATH="${WORK_DIR}/node_modules"
            ;;
          *)
            echo "❌ Unsupported package manager: $PKG_MANAGER"
            exit 1
            ;;
        esac

        echo "lock-file=${LOCK_FILE}" >> $GITHUB_OUTPUT
        echo "cache-path=${CACHE_PATH}" >> $GITHUB_OUTPUT
        echo "cache-key=${PREFIX}-${PKG_MANAGER}-${{ runner.os }}" >> $GITHUB_OUTPUT

        echo "📦 Package manager: ${PKG_MANAGER}"
        echo "📁 Lock file: ${LOCK_FILE}"
        echo "📂 Cache path: ${CACHE_PATH}"

    - name: Cache dependencies
      id: cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.prepare.outputs.cache-path }}
        key: ${{ steps.prepare.outputs.cache-key }}-${{ hashFiles(steps.prepare.outputs.lock-file) }}
        restore-keys: |
          ${{ steps.prepare.outputs.cache-key }}-

    - name: Cache status
      shell: bash
      run: |
        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "✅ Cache hit! Dependencies restored from cache"
        else
          echo "❌ Cache miss. Dependencies will be installed"
        fi

branding:
  icon: 'archive'
  color: 'purple'
